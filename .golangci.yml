version: "2"

linters:
  default: all
  disable:
    - bodyclose # Too many false positives: https://github.com/timakin/bodyclose/issues/30
    - canonicalheader # net/http canonicalizes header names, we keep the spelling from the Cloudflare docs
    - cyclop # duplicate of gocyclo
    - depguard
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - gomodguard
    - lll
    - mnd
    - nlreturn
    - noctx
    - noinlineerr
    - paralleltest
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    funlen:
      lines: -1
      statements: 50
    goconst:
      min-len: 5
      min-occurrences: 4
    gocyclo:
      min-complexity: 12
    godox:
      keywords:
        - FIXME
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US
  exclusions:
    rules:
      - path: (.+)_test.go
        linters:
          - funlen
          - goconst
          - godot
      - path: (.+)\.go$
        text: ST1000

issues:
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
